        '401': {$ref: '#/components/responses/Unauthorized'}
        '422': {$ref: '#/components/responses/ValidationError'}

  /auth/session/status:
    get:
      tags: [Auth]
      operationId: sessionStatus
      parameters:
        - {$ref: '#/components/parameters/DeviceIdQuery'}
      responses:
        '200': {$ref: '#/components/responses/Success'}
        '401': {$ref: '#/components/responses/Unauthorized'}

  /public/site:
    get:
