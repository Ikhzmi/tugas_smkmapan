components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: Sanctum

  responses:
    Success:
      description: Operasi berhasil
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiResponse'
    Created:
      description: Resource berhasil dibuat
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiResponse'
    List:
      description: Daftar resource dengan pagination
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ListResponse'
    NoContent:
      description: Operasi berhasil tanpa body
    Unauthorized:
      description: Token tidak ada atau tidak valid
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Forbidden:
      description: Role atau ownership tidak memenuhi syarat
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: Resource tidak ditemukan atau disembunyikan karena ownership
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Conflict:
      description: Konflik state atau resource duplikat
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    ValidationError:
      description: Data request tidak valid
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    TooManyRequests:
      description: Rate limit terlampaui
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

  parameters:
    PerPage:
      in: query
      name: per_page
      required: false
      schema: {type: integer, minimum: 1, maximum: 100, default: 20}
    PerPage50:
      in: query
      name: per_page
      required: false
      schema: {type: integer, minimum: 1, maximum: 100, default: 50}
    Search:
      in: query
      name: q
      required: false
      schema: {type: string, maxLength: 150}
    RoleQuery:
      in: query
      name: role
      required: false
      schema: {type: string, enum: [admin, guru, siswa]}
    DeviceIdQuery:
      in: query
      name: device_id
      required: false
      schema: {type: string, maxLength: 100}
    CategoryQuery:
      in: query
      name: category
      required: false
      schema: {type: string, maxLength: 30}
    ClassIdQuery:
      in: query
      name: class_id
      required: false
      schema: {$ref: '#/components/schemas/Uuid'}
    TeacherIdQuery:
      in: query
      name: teacher_id
      required: false
      schema: {$ref: '#/components/schemas/Uuid'}
    DayQuery:
      in: query
      name: hari
      required: false
      schema: {type: string, enum: [senin, selasa, rabu, kamis, jumat, sabtu]}
    DateQuery:
      in: query
      name: tanggal
      required: false
      schema: {type: string, format: date}
    DateFrom:
      in: query
      name: date_from
      required: false
      schema: {type: string, format: date}
    DateTo:
      in: query
      name: date_to
      required: false
      schema: {type: string, format: date}
    AnalyticsRange:
      in: query
      name: range
      required: false
      schema: {type: integer, enum: [7, 30, 90], default: 7}
    PpdbStatusQuery:
      in: query
      name: status
      required: false
      schema: {type: string, enum: [baru, menunggu_verifikasi, diterima, ditolak]}
    Since:
      in: query
      name: since
      required: false
      schema: {type: string, format: date-time}
    Signature:
      in: query
      name: signature
      required: true
      schema: {type: string}
    Expires:
      in: query
      name: expires
      required: true
      schema: {type: integer, format: int64}
    UserId:
      in: path
      name: user
      required: true
      schema: {$ref: '#/components/schemas/Uuid'}
    TeacherId:
      in: path
      name: teacher
      required: true
      schema: {$ref: '#/components/schemas/Uuid'}
    StudentId:
      in: path
      name: student
      required: true
      schema: {$ref: '#/components/schemas/Uuid'}
    MajorId:
      in: path
      name: major
      required: true
      schema: {$ref: '#/components/schemas/Uuid'}
    SchoolClassId:
      in: path
      name: schoolClass
      required: true
      schema: {$ref: '#/components/schemas/Uuid'}
    SubjectId:
      in: path
      name: subject
      required: true
      schema: {$ref: '#/components/schemas/Uuid'}
    ScheduleId:
      in: path
      name: schedule
      required: true
      schema: {$ref: '#/components/schemas/Uuid'}
    SettingKey:
      in: path
      name: key
      required: true
      schema: {type: string, maxLength: 100}
    RegistrationId:
      in: path
      name: registration
      required: true
      schema: {$ref: '#/components/schemas/Uuid'}
    SuggestionId:
      in: path
      name: suggestion
      required: true
      schema: {$ref: '#/components/schemas/Uuid'}
    FacilityId:
      in: path
      name: facility
      required: true
      schema: {$ref: '#/components/schemas/Uuid'}
    EskulId:
      in: path
      name: eskul
      required: true
      schema: {$ref: '#/components/schemas/Uuid'}
    GalleryId:
      in: path
      name: gallery
      required: true
      schema: {$ref: '#/components/schemas/Uuid'}
    VideoId:
      in: path
      name: video
      required: true
      schema: {$ref: '#/components/schemas/Uuid'}
    AttemptId:
      in: path
      name: attempt
      required: true
      schema: {$ref: '#/components/schemas/Uuid'}
    MaterialId:
      in: path
      name: material
      required: true
      schema: {$ref: '#/components/schemas/Uuid'}
    AssignmentId:
      in: path
      name: assignment
      required: true
      schema: {$ref: '#/components/schemas/Uuid'}
    SubmissionId:
      in: path
      name: submission
      required: true
      schema: {$ref: '#/components/schemas/Uuid'}
    ExamId:
      in: path
      name: exam
      required: true
      schema: {$ref: '#/components/schemas/Uuid'}
    QuestionId:
      in: path
      name: question
      required: true
      schema: {$ref: '#/components/schemas/Uuid'}
    AttendanceId:
      in: path
      name: attendance
      required: true
      schema: {$ref: '#/components/schemas/Uuid'}
    UploadContext:
      in: path
      name: context
      required: true
      schema:
        type: string
        enum: [major, hero, profile, teacher-photo, eskul, facility, gallery]

  schemas:
    Uuid:
      type: string
      format: uuid
    ApiResponse:
      type: object
      properties:
        data: {}
        message: {type: string}
        errors:
          type: object
          additionalProperties:
            type: array
            items: {type: string}
        code: {type: string, nullable: true}
        meta: {type: object, additionalProperties: true}
