openapi: 3.0.3
info:
  title: SMKM 8 Medan API
  version: 1.0.0
  description: >-
    Laravel REST API untuk Web SMKM 8 Medan dan handoff mobile. Database
    diakses hanya melalui Laravel; autentikasi menggunakan Sanctum.
servers:
  - url: https://smkm8medan-api.test/api/v1
    description: Herd development (wajib HTTPS; HTTP me-redirect POST menjadi GET)
tags:
  - name: Health
  - name: Auth
  - name: Public
  - name: Admin
  - name: Guru
  - name: Siswa
security:
  - bearerAuth: []
paths:
  /ping:
    get:
      tags: [Health]
      security: []
      operationId: ping
      responses:
        '200':
          description: API aktif
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PingResponse'

  /auth/login:
    post:
      tags: [Auth]
      security: []
      operationId: login
      description: Siswa memakai NISN; guru/admin memakai username atau email.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Login berhasil
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '401': {$ref: '#/components/responses/Unauthorized'}
        '409':
          description: Konflik sesi pada perangkat lain
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422': {$ref: '#/components/responses/ValidationError'}
        '429': {$ref: '#/components/responses/TooManyRequests'}

  /auth/logout:
    post:
      tags: [Auth]
      operationId: logout
      responses:
        '204': {$ref: '#/components/responses/NoContent'}
        '401': {$ref: '#/components/responses/Unauthorized'}

  /auth/me:
    get:
      tags: [Auth]
      operationId: currentUser
      responses:
        '200':
          description: User aktif
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '401': {$ref: '#/components/responses/Unauthorized'}

  /auth/profile:
    patch:
      tags: [Auth]
      operationId: updateProfile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProfileUpdateRequest'
      responses:
        '200': {$ref: '#/components/responses/Success'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '422': {$ref: '#/components/responses/ValidationError'}

  /auth/change-password:
    post:
      tags: [Auth]
      operationId: changePassword
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangePasswordRequest'
      responses:
        '204': {$ref: '#/components/responses/NoContent'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '422': {$ref: '#/components/responses/ValidationError'}

  /auth/session/claim:
    post:
      tags: [Auth]
      operationId: claimSession
      requestBody:
        required: true
