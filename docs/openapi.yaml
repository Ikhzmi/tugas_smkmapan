openapi: 3.0.3
info:
  title: SMKM 8 Medan API
  version: 1.0.0
  description: Laravel REST API; PostgreSQL Supabase project baru melalui Laravel.
servers:
  - url: http://smkm8medan-api.test/api/v1
paths:
  /ping:
    get:
      responses:
        '200': { description: API aktif }
  /auth/login:
    post:
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [identifier, password]
              properties:
                identifier: { type: string }
                password: { type: string, format: password }
                device_id: { type: string }
                device_label: { type: string }
      responses:
        '200': { description: Login berhasil }
        '401': { description: Kredensial salah }
        '409': { description: Konflik sesi }
  /auth/me:
    get:
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: User aktif }
  /public/site:
    get:
      responses:
        '200': { description: Konten publik }
  /siswa/exams/{exam}/attempts:
    post:
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: exam, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '201': { description: Attempt dengan soal aman; tidak berisi kunci jawaban }
  /siswa/attempts/{attempt}/submit:
    post:
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: attempt, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200': { description: Nilai dihitung server }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: Sanctum
