<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/logo.png" />
    <link rel="shortcut icon" type="image/png" href="/logo.png" />
    <link rel="apple-touch-icon" href="/logo.png" />
    <!-- Logo splash diambil lebih awal agar muncul tanpa jeda. -->
    <link rel="preload" as="image" href="/logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Terapkan tema sebelum CSS/React untuk mencegah flash dan menyelaraskan landing + splash. -->
    <script>
      (function () {
        var theme = null;
        try {
          var saved = window.localStorage.getItem('smk-mapan-theme-preference');
          if (saved === 'light' || saved === 'dark') theme = saved;
          // Key versi lama ikut menyimpan tema otomatis, bukan hanya pilihan manual.
          window.localStorage.removeItem('smk-mapan-theme');
        } catch (_) {}
        if (!theme) {
          theme = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches
            ? 'dark'
            : 'light';
        }
        document.documentElement.classList.toggle('dark', theme === 'dark');
        document.documentElement.classList.toggle('light', theme === 'light');
        document.documentElement.style.colorScheme = theme;
      })();
    </script>
    <meta name="description" content="Website Resmi SMK Pusat Keunggulan SMK Muhammadiyah 8 Medan (MAPAN). Terakreditasi A BAN-SM. Dilengkapi Mapan Learning Ecosystem (LMS), Lab Virtual Jaringan, CBT Online, dan Program Keahlian TKJ, DKV, AKL." />
    <meta name="keywords" content="SMK Muhammadiyah 8 Medan, SMK Mapan, SMK Pusat Keunggulan Medan, PPDB SMK Medan, TKJ, DKV, AKL, LMS Sekolah, E-Learning Vokasi" />
    <meta name="theme-color" content="#FF6B00" />
    <title>SMK Muhammadiyah 8 Medan | SMK Pusat Keunggulan & Mapan Learning Ecosystem</title>
    <!-- Latar awal mengikuti tema sistem agar tidak ada kedipan putih sebelum CSS/React siap. -->
    <style>
      html { background-color: #ffffff; }
      html.dark { background-color: #08080a; }
      @media (prefers-color-scheme: dark) {
        html:not(.light) { background-color: #08080a; }
      }
    </style>
    <!-- Google Fonts: Plus Jakarta Sans & JetBrains Mono -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=JetBrains+Mono:wght@400;500;600&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <script>
      (function () {
        var messages = [];
        function push(text) {
          if (text && messages.indexOf(text) === -1) messages.push(text);
        }
        window.addEventListener('error', function (e) {
          if (e && e.message) {
            push(e.message + (e.filename ? ' @ ' + e.filename + ':' + e.lineno : ''));
          } else if (e && e.target && (e.target.src || e.target.href)) {
            push('Gagal memuat berkas: ' + (e.target.src || e.target.href));
          }
        }, true);
        window.addEventListener('unhandledrejection', function (e) {
          var r = e && e.reason;
          push('Promise ditolak: ' + ((r && r.message) || r));
        });
        setTimeout(function () {
          var root = document.getElementById('root');
          if (!root || root.children.length) return;
          var box = document.createElement('div');
          box.setAttribute('style', 'position:fixed;inset:0;z-index:99999;background:#fff;color:#111;font:14px/1.6 system-ui,-apple-system,Segoe UI,sans-serif;padding:28px;overflow:auto');
          var body = messages.length ? messages.join('\n') : 'Tidak ada pesan error yang tertangkap.';
          box.innerHTML =
            '<h2 style="margin:0 0 10px;font-size:18px">Aplikasi gagal dimuat</h2>' +
            '<p style="margin:0 0 12px;color:#555">Halaman tampak kosong karena JavaScript tidak berjalan. Kirim teks di bawah ini ke pengembang.</p>' +
            '<pre style="white-space:pre-wrap;background:#f5f5f5;border:1px solid #ddd;border-radius:8px;padding:12px;font-size:12px;margin:0 0 12px"></pre>' +
            '<p style="color:#555;margin:0">Coba: hard reload (Ctrl+Shift+R), matikan ekstensi/VPN, atau buka <strong>http://127.0.0.1:5173</strong>.</p>';
          box.querySelector('pre').textContent = body + '\n\nUA: ' + navigator.userAgent;
          root.appendChild(box);

          // Cold-start bisa melewati 5 detik; begitu React mount, box ini harus
          // hilang agar tidak menutupi aplikasi yang sebenarnya sehat.
          var observer = new MutationObserver(function () {
            for (var i = 0; i < root.children.length; i++) {
              if (root.children[i] !== box) {
                observer.disconnect();
                box.remove();
                return;
              }
            }
          });
          observer.observe(root, { childList: true });
        }, 5000);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
