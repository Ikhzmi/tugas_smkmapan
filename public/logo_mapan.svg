<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <defs>
    <linearGradient id="grad-primary" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF7A00" />
      <stop offset="100%" stop-color="#E65100" />
    </linearGradient>
    <linearGradient id="grad-navy" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284C7" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#FF6B00" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Outer Emblem Shield / Hexagon -->
  <path d="M 60 6 L 106 28 L 106 78 L 60 114 L 14 78 L 14 28 Z" fill="#0F172A" stroke="url(#grad-primary)" stroke-width="4" filter="url(#shadow)" />
  
  <!-- Muhammadiyah Sun Rays (12 radiating petals/rays) -->
  <g transform="translate(60,54)">
    <!-- Central sun circle -->
    <circle cx="0" cy="0" r="18" fill="url(#grad-primary)" />
    
    <!-- 12 Radiating rays -->
    <path d="M 0 -26 L 4 -19 L -4 -19 Z" fill="#FFB703" />
    <path d="M 13 -22 L 13 -14 L 7 -18 Z" fill="#FFB703" />
    <path d="M 22 -13 L 18 -7 L 14 -13 Z" fill="#FFB703" />
    <path d="M 26 0 L 19 4 L 19 -4 Z" fill="#FFB703" />
    <path d="M 22 13 L 14 13 L 18 7 Z" fill="#FFB703" />
    <path d="M 13 22 L 7 18 L 13 14 Z" fill="#FFB703" />
    <path d="M 0 26 L -4 19 L 4 19 Z" fill="#FFB703" />
    <path d="M -13 22 L -13 14 L -7 18 Z" fill="#FFB703" />
    <path d="M -22 13 L -18 7 L -14 13 Z" fill="#FFB703" />
    <path d="M -26 0 L -19 -4 L -19 4 Z" fill="#FFB703" />
    <path d="M -22 -13 L -14 -13 L -18 -7 Z" fill="#FFB703" />
    <path d="M -13 -22 L -7 -18 L -13 -14 Z" fill="#FFB703" />
    
    <!-- Inner Book & Syahadat symbol -->
    <path d="M -10 4 Q 0 1 10 4 L 10 10 Q 0 7 -10 10 Z" fill="#FFFFFF" />
    <path d="M 0 1 L 0 9" stroke="#0F172A" stroke-width="1.5" />
    <circle cx="0" cy="-4" r="5" fill="#FFFFFF" />
  </g>

  <!-- Number 8 Badge / Banner -->
  <rect x="36" y="86" width="48" height="20" rx="10" fill="url(#grad-primary)" />
  <text x="60" y="101" fill="#FFFFFF" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="12" text-anchor="middle" letter-spacing="1">MAPAN 8</text>
</svg>
