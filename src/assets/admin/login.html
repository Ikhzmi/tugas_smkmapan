<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Login - SMK Muhammadiyah 8 Medan</title>
  <link rel="icon" href="../images/logo.png" type="image/png">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Inter', sans-serif;
      background: #0a0a0f;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      position: relative;
    }

    /* Animated Background */
    .bg-animation {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      z-index: 0;
      overflow: hidden;
    }

    .bg-animation::before {
      content: '';
      position: absolute;
      top: -50%;
      left: -50%;
      width: 200%;
      height: 200%;
      background: radial-gradient(ellipse at 20% 20%, rgba(255, 120, 60, 0.15) 0%, transparent 50%),
                  radial-gradient(ellipse at 80% 80%, rgba(255, 60, 100, 0.1) 0%, transparent 50%),
                  radial-gradient(ellipse at 50% 50%, rgba(20, 10, 40, 0.8) 0%, transparent 70%);
      animation: bgMove 8s ease-in-out infinite alternate;
    }

    @keyframes bgMove {
      0% { transform: translate(0, 0) rotate(0deg); }
      100% { transform: translate(30px, 20px) rotate(3deg); }
    }

    .floating-shapes {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      z-index: 0;
    }

    .shape {
      position: absolute;
      border-radius: 50%;
      background: linear-gradient(135deg, rgba(255,120,60,0.1), rgba(255,60,100,0.05));
      border: 1px solid rgba(255,120,60,0.1);
      animation: float linear infinite;
    }

    .shape:nth-child(1) { width: 80px; height: 80px; top: 10%; left: 10%; animation-duration: 12s; animation-delay: 0s; }
    .shape:nth-child(2) { width: 120px; height: 120px; top: 70%; left: 80%; animation-duration: 15s; animation-delay: -3s; }
    .shape:nth-child(3) { width: 60px; height: 60px; top: 40%; left: 90%; animation-duration: 10s; animation-delay: -6s; }
    .shape:nth-child(4) { width: 100px; height: 100px; top: 80%; left: 20%; animation-duration: 18s; animation-delay: -9s; }
    .shape:nth-child(5) { width: 40px; height: 40px; top: 20%; left: 70%; animation-duration: 8s; animation-delay: -2s; }

    @keyframes float {
      0% { transform: translateY(0px) rotate(0deg); opacity: 0.5; }
      50% { transform: translateY(-30px) rotate(180deg); opacity: 1; }
      100% { transform: translateY(0px) rotate(360deg); opacity: 0.5; }
    }

    /* Login Container */
    .login-wrapper {
      position: relative;
      z-index: 10;
      width: 100%;
      max-width: 420px;
      padding: 20px;
    }

    .login-card {
      background: rgba(255, 255, 255, 0.03);
      backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 24px;
      padding: 48px 40px;
      box-shadow: 0 40px 80px rgba(0, 0, 0, 0.6), 
                  0 0 0 1px rgba(255, 120, 60, 0.1),
                  inset 0 1px 0 rgba(255, 255, 255, 0.05);
      animation: slideUp 0.6s cubic-bezier(0.16, 1, 0.3, 1);
    }

    @keyframes slideUp {
      from { opacity: 0; transform: translateY(40px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .login-header {
      text-align: center;
      margin-bottom: 40px;
    }

    .logo-container {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      margin-bottom: 20px;
    }

    .logo-container img {
      width: 52px;
      height: 52px;
      object-fit: contain;
      filter: drop-shadow(0 0 12px rgba(255,120,60,0.5));
    }

    .admin-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: linear-gradient(135deg, rgba(255,120,60,0.15), rgba(255,60,100,0.1));
      border: 1px solid rgba(255,120,60,0.3);
      border-radius: 20px;
      padding: 6px 14px;
      margin-bottom: 16px;
      font-size: 11px;
      font-weight: 600;
      color: #ff7a3c;
      text-transform: uppercase;
      letter-spacing: 1.5px;
    }

    .admin-badge i {
      font-size: 10px;
    }

    .login-header h1 {
      font-size: 26px;
      font-weight: 800;
      color: #ffffff;
      line-height: 1.2;
      margin-bottom: 8px;
    }

    .login-header p {
      font-size: 14px;
      color: rgba(255, 255, 255, 0.4);
      font-weight: 400;
    }

    /* Form */
    .form-group {
      margin-bottom: 20px;
    }

    .form-label {
      display: block;
      font-size: 12px;
      font-weight: 600;
      color: rgba(255, 255, 255, 0.5);
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 8px;
    }

    .input-wrapper {
      position: relative;
    }

    .input-icon {
      position: absolute;
      left: 16px;
      top: 50%;
      transform: translateY(-50%);
      color: rgba(255, 255, 255, 0.3);
      font-size: 14px;
      transition: color 0.3s;
    }

    .form-input {
      width: 100%;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 12px;
      padding: 14px 16px 14px 44px;
      color: #ffffff;
      font-size: 14px;
      font-family: 'Inter', sans-serif;
      transition: all 0.3s ease;
      outline: none;
    }

    .form-input::placeholder {
      color: rgba(255, 255, 255, 0.25);
    }

    .form-input:focus {
      background: rgba(255, 120, 60, 0.05);
      border-color: rgba(255, 120, 60, 0.5);
      box-shadow: 0 0 0 3px rgba(255, 120, 60, 0.1);
    }

    .form-input:focus + .input-icon,
    .input-wrapper:focus-within .input-icon {
      color: #ff7a3c;
    }

    .input-icon { pointer-events: none; }

    .toggle-password {
      position: absolute;
      right: 16px;
      top: 50%;
      transform: translateY(-50%);
      color: rgba(255, 255, 255, 0.3);
      cursor: pointer;
      font-size: 14px;
      transition: color 0.3s;
    }

    .toggle-password:hover {
      color: #ff7a3c;
    }

    /* Error Message */
    .error-msg {
      display: none;
      background: rgba(255, 60, 60, 0.1);
      border: 1px solid rgba(255, 60, 60, 0.3);
      border-radius: 10px;
      padding: 12px 16px;
      color: #ff6b6b;
      font-size: 13px;
      margin-bottom: 20px;
      align-items: center;
      gap: 8px;
    }

    .error-msg.show {
      display: flex;
    }

    /* Login Button */
    .login-btn {
      width: 100%;
      background: linear-gradient(135deg, #ff7a3c, #ff4060);
      border: none;
      border-radius: 12px;
      padding: 15px;
      color: #ffffff;
      font-size: 15px;
      font-weight: 700;
      font-family: 'Inter', sans-serif;
      cursor: pointer;
      transition: all 0.3s ease;
      position: relative;
      overflow: hidden;
      letter-spacing: 0.5px;
    }

    .login-btn::before {
      content: '';
      position: absolute;
      top: 0; left: -100%;
      width: 100%; height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.15), transparent);
      transition: left 0.5s ease;
    }

    .login-btn:hover::before {
      left: 100%;
    }

    .login-btn:hover {
      transform: translateY(-1px);
      box-shadow: 0 8px 25px rgba(255, 120, 60, 0.4);
    }

    .login-btn:active {
      transform: translateY(0);
    }

    .login-btn.loading {
      pointer-events: none;
      opacity: 0.8;
    }

    .btn-content {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .spinner {
      display: none;
      width: 16px;
      height: 16px;
      border: 2px solid rgba(255,255,255,0.3);
      border-top-color: white;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    /* Back to site */
    .back-link {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      margin-top: 28px;
      color: rgba(255, 255, 255, 0.35);
      font-size: 13px;
      text-decoration: none;
      transition: color 0.3s;
    }

    .back-link:hover {
      color: #ff7a3c;
    }

    /* Divider */
    .divider {
      display: flex;
      align-items: center;
      gap: 12px;
      margin: 24px 0;
    }

    .divider-line {
      flex: 1;
      height: 1px;
      background: rgba(255, 255, 255, 0.06);
    }

    .divider-text {
      font-size: 11px;
      color: rgba(255, 255, 255, 0.2);
      text-transform: uppercase;
      letter-spacing: 1px;
      white-space: nowrap;
    }

    .credentials-hint {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.06);
      border-radius: 10px;
      padding: 12px 16px;
      font-size: 12px;
      color: rgba(255, 255, 255, 0.3);
      text-align: center;
      line-height: 1.6;
    }

    .credentials-hint strong {
      color: rgba(255, 255, 255, 0.5);
    }
  </style>
</head>
<body>

  <div class="bg-animation"></div>
  <div class="floating-shapes">
    <div class="shape"></div>
    <div class="shape"></div>
    <div class="shape"></div>
    <div class="shape"></div>
    <div class="shape"></div>
  </div>

  <div class="login-wrapper">
    <div class="login-card">
      <div class="login-header">
        <div class="logo-container">
          <img src="../images/logo.png" alt="SMK Muhammadiyah 8 Medan">
        </div>
        <div class="admin-badge">
          <i class="fas fa-shield-halved"></i>
          Admin Panel
        </div>
        <h1>Selamat Datang</h1>
        <p>Masuk untuk mengelola konten website</p>
      </div>

      <div class="error-msg" id="errorMsg">
        <i class="fas fa-circle-exclamation"></i>
        <span id="errorText">Username atau password salah!</span>
      </div>

      <form id="loginForm" onsubmit="handleLogin(event)">
        <div class="form-group">
          <label class="form-label">Username</label>
          <div class="input-wrapper">
            <input type="text" class="form-input" id="username" placeholder="Masukkan username" autocomplete="username" required>
            <i class="fas fa-user input-icon"></i>
          </div>
        </div>

        <div class="form-group">
          <label class="form-label">Password</label>
          <div class="input-wrapper">
            <input type="password" class="form-input" id="password" placeholder="Masukkan password" autocomplete="current-password" required>
            <i class="fas fa-lock input-icon"></i>
            <i class="fas fa-eye toggle-password" id="togglePass" onclick="togglePassword()"></i>
          </div>
        </div>

        <button type="submit" class="login-btn" id="loginBtn">
          <div class="btn-content">
            <div class="spinner" id="spinner"></div>
            <span id="btnText"><i class="fas fa-arrow-right-to-bracket"></i> Masuk ke Dashboard</span>
          </div>
        </button>
      </form>

      <div class="divider">
        <div class="divider-line"></div>
        <span class="divider-text">Info Login</span>
        <div class="divider-line"></div>
      </div>

      <div class="credentials-hint">
        Username: <strong>admin</strong> &nbsp;|&nbsp; Password: <strong>smkm8medan</strong>
      </div>

      <a href="../index.html" class="back-link">
        <i class="fas fa-arrow-left"></i>
        Kembali ke Website
      </a>
    </div>
  </div>

  <script>
    // Admin credentials
    const ADMIN_CREDENTIALS = {
      username: 'admin',
      password: 'smkm8medan'
    };

    function handleLogin(e) {
      e.preventDefault();
      const username = document.getElementById('username').value;
      const password = document.getElementById('password').value;
      const btn = document.getElementById('loginBtn');
      const spinner = document.getElementById('spinner');
      const btnText = document.getElementById('btnText');
      const errorMsg = document.getElementById('errorMsg');

      // Show loading
      btn.classList.add('loading');
      spinner.style.display = 'block';
      btnText.textContent = 'Memverifikasi...';
      errorMsg.classList.remove('show');

      setTimeout(() => {
        if (username === ADMIN_CREDENTIALS.username && password === ADMIN_CREDENTIALS.password) {
          // Set session
          sessionStorage.setItem('smk_admin_logged', 'true');
          sessionStorage.setItem('smk_admin_user', username);
          sessionStorage.setItem('smk_admin_time', new Date().toISOString());
          
          btnText.innerHTML = '<i class="fas fa-check"></i> Berhasil! Mengalihkan...';
          setTimeout(() => {
            window.location.href = 'dashboard.html';
          }, 600);
        } else {
          btn.classList.remove('loading');
          spinner.style.display = 'none';
          btnText.innerHTML = '<i class="fas fa-arrow-right-to-bracket"></i> Masuk ke Dashboard';
          errorMsg.classList.add('show');
          document.getElementById('password').value = '';
          document.getElementById('password').focus();
        }
      }, 1200);
    }

    function togglePassword() {
      const pass = document.getElementById('password');
      const icon = document.getElementById('togglePass');
      if (pass.type === 'password') {
        pass.type = 'text';
        icon.classList.remove('fa-eye');
        icon.classList.add('fa-eye-slash');
      } else {
        pass.type = 'password';
        icon.classList.remove('fa-eye-slash');
        icon.classList.add('fa-eye');
      }
    }

    // Check if already logged in
    if (sessionStorage.getItem('smk_admin_logged') === 'true') {
      window.location.href = 'dashboard.html';
    }
  </script>
</body>
</html>
