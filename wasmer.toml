[package]
name = "sky-last/smkm8medan-api"
version = "0.1.0"
description = "SMKM 8 Medan REST API on Wasmer Edge"
license = "MIT"

[dependencies]
"phpix/phpix-84-64bit" = "*"

[fs]
"/app" = "."

[[command]]
name = "serve"
module = "phpix/phpix-84-64bit:phpix"
runner = "wasi"

[command.annotations.wasi]
main-args = [
    "-d", "variables_order=EGPCS",
    "-t", "/app/public",
    "-S", "0.0.0.0:8080",
    "/app/public/index.php"
]
